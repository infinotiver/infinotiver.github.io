<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404</title>
    <link rel="shortcut icon" href="/assets/logo_new.webp" type="image/webp" />
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            background: #000;
            color-scheme: dark;
        }

        body {
            display: grid;
            place-items: center;
            padding: 1.5rem;
            box-sizing: border-box;
            color: #fff;
            font: 500 0.875rem/1.4 system-ui, sans-serif;
        }

        /* page column */
        main {
            --size: clamp(1.5rem, 5.5vw, 3.2rem);
            width: min(40rem, 100%);
            display: grid;
            justify-items: center;
            gap: clamp(0.9rem, 3vw, 1.5rem);
            text-align: center;
        }

        /* art is hidden until the sprite loads */
        .a {
            display: none;
        }

        [data-art] .a {
            display: block;
        }

        [data-art] .t {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        /* big 404 */
        h1 {
            margin: 0;
            font: 800 clamp(5rem, 20vw, 10rem) / 0.9 system-ui, sans-serif;
            letter-spacing: -0.05em;
        }

        h1 .a {
            height: clamp(5rem, 20vw, 10rem);
            width: auto;
            max-width: 100%;
        }

        /* joke lines share one letter height */
        .joke {
            display: grid;
            gap: 0.3rem;
            justify-items: center;
            width: 100%;
            margin: 0;
        }

        .joke .t {
            font-size: 1rem;
        }

        .joke .a {
            height: var(--size);
            width: auto;
            max-width: 100%;
        }

        /* links */
        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
        }

        nav a {
            display: inline-flex;
            align-items: center;
            color: #fff;
            background: #222;
            font-size: 0.8rem;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 999px;
            transition: background 0.15s, color 0.15s;
        }

        nav .a {
            height: 2rem;
            width: auto;
            max-width: 100%;
        }

        nav a:hover,
        nav a:focus-visible {
            background: #fff;
            color: #000;
            outline: none;
        }

        /* style toggle */
        #mode {
            position: absolute;
            left: 1rem;
            top: 1rem;
            font: inherit;
            font-size: 0.75rem;
            color: #aaa;
            background: #444;
            border-radius: 8px;
            border: none;
            padding: 0.3rem 0.8rem;
            cursor: pointer;
        }

        #mode:hover,
        #mode:focus-visible {
            color: #fff;
        }

        /* phones: lines fit the width, box shrinks with the letters */
        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }

            .joke .a {
                height: auto;
            }
        }
    </style>
</head>

<body>
    <main>
        <button id="mode" type="button" hidden aria-pressed="false">plain text</button>
        <h1>
            <span class="t">404</span>
            <svg class="a" viewBox="0 -800 1386 1000" aria-hidden="true">
                <use href="#n404" />
            </svg>
        </h1>
        <p class="joke">
            <span class="t">you either mistyped or i deleted that page</span>
            <svg class="a" viewBox="0 -782 15363 1049" aria-hidden="true">
                <use href="#j1" />
            </svg>
            <span class="t">but let's agree to blame it on you</span>
            <svg class="a" viewBox="0 -782 12412 1049" aria-hidden="true">
                <use href="#j2" />
            </svg>
        </p>
        <nav>
            <a href="/">
                <span class="t">Home</span>
                <svg class="a" viewBox="0 -800 2541 1000" aria-hidden="true">
                    <use href="#home" />
                </svg>
            </a>
            <a href="https://github.com/infinotiver">
                <span class="t">GitHub</span>
                <svg class="a" viewBox="0 -800 3267 1000" aria-hidden="true">
                    <use href="#gh" />
                </svg>
            </a>
        </nav>
    </main>

    <script>
        // Load the handwriting sprite; on any failure the plain text stays
        const root = document.documentElement;
        const btn = document.getElementById("mode");
        let art = false;

        const isPlain = () => { try { return localStorage.getItem("404-plain") === "1"; } catch { return false; } };
        const savePlain = v => { try { localStorage.setItem("404-plain", v ? "1" : "0"); } catch { } };

        // Switch between handwriting and plain text
        const show = on => {
            art = on;
            root.toggleAttribute("data-art", on);
            btn.textContent = on ? "plain text" : "handwriting";
            btn.setAttribute("aria-pressed", String(!on));
        };

        fetch("/assets/404-sprite.svg")
            .then(r => (r.ok ? r.text() : Promise.reject()))
            .then(svg => {
                document.body.insertAdjacentHTML("afterbegin", svg);
                btn.hidden = false;
                show(!isPlain());
                btn.onclick = () => { show(!art); savePlain(!art); };
            })
            .catch(() => { });
    </script>
</body>

</html>
