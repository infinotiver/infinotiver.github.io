<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404</title>
    <link rel="shortcut icon" href="/assets/logo_new.webp" type="image/webp" />
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            background: #000;
            color-scheme: dark;
        }

        body {
            display: grid;
            place-items: center;
            padding: 1.5rem;
            box-sizing: border-box;
            color: #fff;
            font: 500 0.875rem/1.4 system-ui, sans-serif;
        }

        /* page column */
        main {
            --size: clamp(1.5rem, 5.5vw, 3.2rem);
            /* joke letter height */
            width: min(40rem, 100%);
            display: grid;
            justify-items: center;
            gap: clamp(0.9rem, 3vw, 1.5rem);
            text-align: center;
        }

        /* big 404 */
        h1 {
            margin: 0;
            font: 800 clamp(5rem, 20vw, 10rem) / 0.9 system-ui, sans-serif;
            letter-spacing: -0.05em;
        }

        /* joke lines share one letter height */
        .joke {
            display: grid;
            gap: 0.3rem;
            justify-items: center;
            color: #fff;
            width: 100%;
            margin: 0;
        }

        .joke svg {
            height: var(--size);
            width: auto;
            max-width: 100%;
        }

        /* links */
        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
        }

        nav a {
            color: #fff;
            background: #222;
            font-size: 0.8rem;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 999px;
            transition: background 0.15s, color 0.15s;
        }

        nav a:hover,
        nav a:focus-visible {
            background: #fff;
            color: #000;
            outline: none;
        }

        /* screen-reader only text */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        /* phones: fixed letter height, line scrolls sideways */
        @media (max-width: 600px) {
            main {
                --size-narrow: 2.2rem;
            }

            .joke {
                justify-items: start;
                overflow-x: auto;
            }

            .joke svg {
                height: var(--size-narrow);
                max-width: none;
            }
        }

        /* phones: auto-pan instead of manual scroll */
        @media (max-width: 600px) and (prefers-reduced-motion: no-preference) {
            .joke {
                overflow: hidden;
                container-type: inline-size;
            }

            .joke svg {
                animation: pan 8s ease-in-out infinite alternate;
            }
        }

        /* slide the line until its right end meets the container edge */
        @keyframes pan {
            to {
                transform: translateX(calc(100cqw - 100%));
            }
        }
    </style>
</head>
