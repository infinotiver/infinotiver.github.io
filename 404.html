<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404</title>
    <link rel="shortcut icon" href="/assets/avatars/transparent.webp" type="image/webp" />
    <style>
        html {
            min-height: 100%;
            background: #000;
            color-scheme: dark;
        }

        body {
            padding: clamp(1rem, 4svh, 3rem) clamp(1.25rem, 5vw, 3rem);
            box-sizing: border-box;
            min-height: 100svh;
            margin: 0;
            display: grid;
            grid-template-columns: minmax(0, 40rem);
            place-content: center;
            justify-items: center;
            gap: clamp(1rem, 3svh, 2.5rem);
            overflow-x: clip;
            color: #fff;
            font: 500 0.875rem/1.4 system-ui, sans-serif;
        }

        body>svg {
            position: absolute;
            width: 0;
            height: 0;
        }

        .a {
            display: none;
        }

        [data-art] .a {
            display: block;
        }

        [data-art] .t {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        main {
            width: 100%;
            display: grid;
            justify-items: center;
            gap: clamp(1rem, 3vw, 1.5rem);
            text-align: center;
        }

        h1 {
            width: 100%;
            box-sizing: border-box;
            margin: 0;
            display: grid;
            place-items: center;
            font: 800 clamp(5rem, 28vw, 10rem) / 0.9 system-ui, sans-serif;
            letter-spacing: -0.05em;
            padding-inline: 0.5rem;
        }

        h1 .a {
            height: clamp(4rem, min(28vw, 18svh), 14rem);
            overflow: visible;
            max-width: 100%;
            fill: transparent;
            stroke: #fff;
            stroke-width: 6;
            stroke-linejoin: round;
            transition: fill 0.25s;
        }

        h1:hover .a {
            fill: #fff;
        }

        .message {
            display: grid;
            gap: 0.3rem;
        }

        .joke {
            margin: 0;
            font-size: clamp(0.85rem, 3.5vw, 1.1rem);
            color: #d4d4d4;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
        }

        nav a {
            display: inline-flex;
            align-items: center;
            color: #fff;
            background: #222;
            padding: 0.55rem 1.1rem;
            border-radius: 999px;
            text-decoration: none;
            transition: background 0.15s, color 0.15s;
        }

        nav a:hover,
        nav a:focus-visible {
            background: #fff;
            color: #000;
            outline: none;
        }

        nav .a {
            height: 1.5rem;
            width: auto;
            max-width: 100%;
        }

        .surprise {
            --cols: 80;
            --rows: 36;
            --art: max(0.25rem,
                    min(calc(min(26rem, 100vw - 2.5rem) / (var(--cols) * 0.6)),
                        calc((100svh - 24rem) / var(--rows))));
            width: min(100%, 26rem);

            display: grid;
            place-items: center;
            opacity: 0.8;
        }

        .surprise pre {
            margin: 0;
            max-width: 100%;
            overflow: visible;
            font: var(--art) / 1 monospace;
            white-space: pre;
        }
    </style>
</head>

<body>
    <main>
        <h1>
            <span class="wrap">
                <span class="t">404</span>
                <svg class="a" viewBox="0 -800 1386 1000" aria-hidden="true">
                    <use href="#n404" />
                </svg>
            </span>
        </h1>
        <div class="message">
            <p class="joke">
                did you type random letters again?
            </p>
        </div>
        <nav>
            <a href="/">
                <span class="t">Home</span>
                <svg class="a" viewBox="0 -800 2541 1000" aria-hidden="true">
                    <use href="#home" />
                </svg>
            </a>
            <a href="https://github.com/infinotiver">
                <span class="t">GitHub</span>
                <svg class="a" viewBox="0 -800 3267 1000" aria-hidden="true">
                    <use href="#gh" />
                </svg>
            </a>
        </nav>
    </main>
    <section class="surprise" aria-live="polite" aria-label="Surprise">
        <pre id="animation"></pre>
    </section>

    <script>
        fetch("/assets/404-sprite.svg")
            .then(r => (r.ok ? r.text() : Promise.reject()))
            .then(svg => {
                document.body.insertAdjacentHTML("afterbegin", svg);
                document.documentElement.setAttribute("data-art", "");
            })
            .catch(() => { });

        import("/assets/js/surprise/rickroll.js")
            .then(({ startRickroll }) => startRickroll(document.getElementById("animation")))
            .catch(() => {
                document.getElementById("animation").textContent = "surprise unavailable";
            });
    </script>
</body>

</html>
